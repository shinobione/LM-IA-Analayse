name: Validate SonicTrace Phase 5

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/phase5-sonictrace, agent/neural-accuracy-v3-foundation, agent/neural-v3-music-expert, agent/semantic-v31-genre-authority-fix, agent/neural-v32-semantic-taxonomy, agent/neural-v321-bootstrap-hardening, agent/neural-v33-structure-intelligence, agent/v331-runtime-cache-catalog, agent/neural-v34-generalization]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: FFmpeg analysis regression tests
        env:
          PYTHONPATH: backend
        run: python backend/tests/test_ffmpeg_analysis.py

      - name: Studio contract tests
        env:
          PYTHONPATH: backend
        run: python backend/tests/test_studio_contract.py

      - name: Neural V3 taxonomy tests
        env:
          PYTHONPATH: backend
        run: python backend/tests/test_neural_taxonomy.py

      - name: Neural V3 ensemble tests
        env:
          PYTHONPATH: backend
        run: python backend/tests/test_genre_ensemble.py

      - name: Neural V3.2 semantic dimensions tests
        env:
          PYTHONPATH: backend
        run: python backend/tests/test_genre_dimensions.py

      - name: Neural V3.5.2 real-runtime family authority tests
        env:
          PYTHONPATH: backend
        run: python backend/tests/test_genre_dimensions_v352_runtime.py

      - name: Windows stale runtime listener parser regression
        working-directory: tools
        run: python test_runtime_manager.py

      - name: SHINOBIWAN analysis benchmark tests
        env:
          PYTHONPATH: backend
        run: python backend/tests/test_analysis_benchmark.py

      - name: Python syntax
        run: python -m py_compile tools/runtime_manager.py tools/test_runtime_manager.py backend/app/studio_contract.py backend/app/entrypoint.py backend/app/neural.py backend/app/neural_taxonomy.py backend/app/music_expert.py backend/app/genre_ensemble.py backend/app/genre_dimensions.py backend/app/analysis_benchmark.py backend/tests/test_genre_dimensions_v352_runtime.py backend/tests/smoke_music_expert.py

      - name: Semantic V3.2 genre and arrangement regression
        run: node --check js/semantic-v32.js && node --check js/semantic-bootstrap.js && node --check js/semantic-client.js && node scripts/test-semantic-genre-context.mjs

      - name: Semantic V3.4 bootstrap regression
        run: node scripts/test-semantic-bootstrap-v33.mjs

      - name: Semantic V3.3 structure intelligence regression
        run: node scripts/test-semantic-structure-v33.mjs

      - name: Semantic V3.4 cross-genre generalization regression
        run: node scripts/test-semantic-generalization-v34.mjs

      - name: Catalog V3 family authority and maintenance regression
        run: node --check js/catalog-v3-accuracy.js && node --check js/catalog-maintenance.js && node scripts/test-catalog-v3-accuracy.mjs

      - name: Catalog memory JavaScript syntax
        run: node --check js/catalog-memory.js && node --check js/catalog-style-families.js && node --check js/catalog-style-families-build04.js && node --check js/catalog-family-language-build05.js

      - name: SonicTrace release label and workflow contract
        run: node --check js/readability-overhaul.js && node --check js/unified-analysis.js && node --check js/loader.js && node scripts/test-release-label.mjs && node scripts/test-catalog-style-families.mjs

  music-expert-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU smoke dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "librosa==0.11.0" "onnxruntime>=1.22,<1.27" "pydantic-settings>=2,<3"

      - name: Real Discogs-EffNet ONNX smoke
        env:
          PYTHONPATH: backend
          LMN_MUSIC_EXPERT: auto
        run: python backend/tests/smoke_music_expert.py
