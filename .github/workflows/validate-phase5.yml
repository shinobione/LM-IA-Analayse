name: Validate SonicTrace Phase 5

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/phase5-sonictrace]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Studio contract tests
        env:
          PYTHONPATH: backend
        run: python backend/tests/test_studio_contract.py

      - name: Python syntax
        run: python -m py_compile backend/app/studio_contract.py backend/app/entrypoint.py

      - name: Catalog memory JavaScript syntax
        run: node --check js/catalog-memory.js

      - name: SonicTrace release label syntax and contract
        run: node --check js/readability-overhaul.js && node scripts/test-release-label.mjs
